name: Build Desktop App

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:  # 允许手动触发构建

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: 番茄上班鼓励器-Windows
            file_ext: exe
          - os: macos-latest
            artifact_name: 番茄上班鼓励器-macOS
            file_ext: app

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          pyinstaller --onefile --windowed
          --name "番茄上班鼓励器"
          --clean
          "番茄上班鼓励器.py"

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --onefile --windowed \
            --name "番茄上班鼓励器" \
            --clean \
            "番茄上班鼓励器.py"

      - name: List build output
        shell: bash
        run: ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/番茄上班鼓励器.exe
            dist/番茄上班鼓励器.app
          if-no-files-found: warn

  # 可选：打 tag 时自动创建 Release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          body: |
            ## 番茄上班鼓励器
            - **Windows**: 下载 `番茄上班鼓励器-Windows` 里的 .exe，双击运行
            - **macOS**: 下载 `番茄上班鼓励器-macOS` 里的 .app，拖入 Applications
            - 首次运行如 macOS 提示"无法验证开发者"，请在 系统设置→隐私与安全性 中点击"仍要打开"
