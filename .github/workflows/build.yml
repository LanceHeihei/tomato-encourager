name: Build Desktop App

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:  # 允许手动触发构建

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os_id: windows
            artifact_name: 番茄上班鼓励器-Windows
          - runner: macos-13          # 原生 Intel x86_64 机器
            os_id: macos-intel
            artifact_name: 番茄上班鼓励器-macOS-Intel
          - runner: macos-14          # 原生 Apple Silicon arm64 机器
            os_id: macos-arm
            artifact_name: 番茄上班鼓励器-macOS-AppleSilicon

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build (Windows exe)
        if: matrix.os_id == 'windows'
        run: >
          pyinstaller --onefile --windowed
          --name "番茄上班鼓励器"
          --clean
          "番茄上班鼓励器.py"

      - name: Build (macOS Intel .app)
        if: matrix.os_id == 'macos-intel'
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.13"
        run: |
          pyinstaller --onefile --windowed \
            --name "番茄上班鼓励器" --clean "番茄上班鼓励器.py"
          file "dist/番茄上班鼓励器.app/Contents/MacOS/番茄上班鼓励器"

      - name: Build (macOS Apple Silicon .app)
        if: matrix.os_id == 'macos-arm'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          pyinstaller --onefile --windowed \
            --name "番茄上班鼓励器" --clean "番茄上班鼓励器.py"
          file "dist/番茄上班鼓励器.app/Contents/MacOS/番茄上班鼓励器"

      - name: Show build output
        shell: bash
        run: ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/番茄上班鼓励器.exe
            dist/番茄上班鼓励器.app
          if-no-files-found: warn

  # 打 tag 时自动创建 Release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          body: |
            ## 番茄上班鼓励器
            - **Windows**：下载 `番茄上班鼓励器-Windows` 里的 .exe，双击运行
            - **Intel Mac（老款）**：下载 `番茄上班鼓励器-macOS-Intel`
            - **Apple Silicon Mac（M1/M2/M3/M4）**：下载 `番茄上班鼓励器-macOS-AppleSilicon`
            - 查看自己芯片：左上角  → 关于本机 → "芯片"一栏
            - macOS 首次运行提示"无法验证开发者"：右键 .app → 打开 → 仍要打开（仅一次）
